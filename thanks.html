<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — LandingLens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', sans-serif; background: #09090b; color: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { text-align: center; max-width: 520px; }
  .check { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 28px; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 16px; }
  p { color: #a1a1aa; font-size: 17px; line-height: 1.7; margin-bottom: 12px; }
  .highlight { color: #a78bfa; font-weight: 600; }
  a { color: #6366f1; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1>You're all set.</h1>
  <p>Your AI conversion audit is being generated right now. You'll receive a <span class="highlight">detailed HTML report</span> in your inbox within 15 minutes.</p>
  <p>Check your spam folder if you don't see it. Questions? Reply to the delivery email.</p>
  <p style="margin-top:24px"><a href="/">&#8592; Back to LandingLens</a></p>
</div>
</body>
</html>
